<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lịch Nhớ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#C8372D; --accent-soft:#C8372D1A;
  --bg:#F4F5F7; --surface:#FFFFFF; --line:#E3E5EA; --line-2:#ECEEF2;
  --ink:#16181D; --ink-2:#4A5060; --muted:#5A6070; --faint:#6B7180; --sun:#B42318;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:28px 32px 48px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
h1,h2,p{margin:0}
/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand{display:flex;align-items:center;gap:12px;flex:1 1 240px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.brand b{font-size:18px;letter-spacing:-.01em;display:block}
.brand small{font-size:12px;color:var(--muted);display:block}
.seg{display:flex;background:#E8EAEE;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1 1 0;min-height:40px;padding:0 18px;border:0;border-radius:9px;font-size:14px;font-weight:600;white-space:nowrap;background:transparent;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.12)}
.seg.sm{border-radius:10px;padding:3px;gap:3px;background:#EEF0F3}
.seg.sm button{min-height:36px;padding:0 12px;font-size:13px;border-radius:8px;flex:0 0 auto}
/* calendar */
.cal{flex:999 1 560px;min-width:0}
.side{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:20px}
.calhead{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.calhead .t{flex:1 1 200px;min-width:0}
.calhead h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
.calhead span{font-size:13px;color:var(--muted)}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:#F7F8FA}
.icon{width:40px;padding:0;justify-content:center}
.switch{width:34px;height:20px;border-radius:10px;background:#C3C7CF;display:flex;align-items:center;padding:2px;transition:background .15s}
.switch i{width:16px;height:16px;border-radius:8px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:margin .15s}
[aria-checked="true"] .switch{background:var(--accent)}
[aria-checked="true"] .switch i{margin-left:14px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wd{font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding:4px 0}
.wd.sun{color:var(--sun)}
.cell{min-height:104px;padding:8px;border:1px solid var(--line-2);border-radius:12px;background:#fff;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0;overflow:hidden;transition:border-color .12s}
.cell:hover{border-color:#C9CDD5}
.cell.out{opacity:.45;background:#FAFBFC}
.cell.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell .hd{display:flex;justify-content:space-between;align-items:center;gap:4px}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 5px;border-radius:13px;font-size:14px;font-weight:600}
.cell.sunday .num{color:var(--sun)}
.cell.today .num{background:var(--accent);color:#fff}
.lunar{font-size:11px;color:var(--faint);white-space:nowrap}
.lunar.sp{color:var(--accent);font-weight:700}
.hide-lunar .lunar{display:none}
.chip{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;font-size:11px;font-weight:500;line-height:1.3;padding:2px 6px;border-radius:6px;background:#fff;overflow:hidden;overflow-wrap:anywhere;flex:none}
.more{font-size:11px;color:var(--muted);padding-left:6px}
.dots{display:none;gap:3px;height:6px;align-items:center}
.dots i{width:6px;height:6px;border-radius:3px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;border-top:1px solid #EEF0F3;padding-top:14px}
.legend span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.legend i{width:10px;height:10px;border-radius:3px}
/* side */
.dayhead{display:flex;gap:14px;align-items:center}
.daybox{width:64px;height:64px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;gap:2px}
.daybox small{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.daybox b{font-size:26px;line-height:1}
.dayinfo{display:flex;flex-direction:column;gap:3px;min-width:0}
.dayinfo b{font-size:16px;font-weight:600}
.dayinfo span{font-size:13px;color:var(--ink-2)}
.dayinfo small{font-size:12px;color:var(--muted)}
.hr{height:1px;background:#EEF0F3}
.ev{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px}
.ev .dot{width:8px;height:8px;border-radius:4px;margin-top:6px;flex:none}
.ev b{font-size:14px;font-weight:600;display:block}
.ev span{font-size:12px;color:var(--ink-2)}
.empty{font-size:14px;color:var(--muted)}
.dashed{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:1px dashed #C9CDD5;border-radius:12px;background:#fff;font-size:14px;font-weight:600}
.dashed:hover{border-color:var(--accent);color:var(--accent)}
.up{display:flex;align-items:center;gap:12px;padding:8px;margin:0 -8px;border:0;border-radius:12px;background:transparent;text-align:left;min-width:0;width:calc(100% + 16px)}
.up:hover{background:#F6F7F9}
.badge{width:44px;height:44px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1.1}
.badge b{font-size:16px}
.badge small{font-size:10px;font-weight:600}
.grow{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 auto}
.grow b{font-size:14px;font-weight:600}
.grow b,.grow span{overflow-wrap:anywhere}
.grow span{font-size:12px;color:var(--muted)}
.pill{font-size:12px;font-weight:600;padding:4px 8px;border-radius:999px;background:#F1F2F5;color:var(--ink-2);white-space:nowrap;flex:none}
.pill.soon{background:var(--accent-soft);color:var(--accent)}
.sync{min-height:32px;padding:0 12px;border:0;border-radius:999px;font-size:12px;font-weight:600;background:#F1F2F5;color:var(--ink-2);white-space:nowrap}
.sync.ok{background:#E1F3F0;color:#0B6158}
.sync.err{background:#FDECEA;color:#9A2219}
/* config */
.form{flex:1 1 340px;min-width:0;gap:18px}
.listcol{flex:999 1 480px;min-width:0;display:flex;flex-direction:column;gap:20px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:13px;font-weight:600;color:var(--ink-2)}
.inp{min-height:44px;padding:0 14px;border:1px solid #D5D8DE;border-radius:12px;font-size:16px;background:#fff;width:100%}
select.inp{padding:0 10px}
textarea.inp{padding:10px 14px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.preview{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--bg)}
.preview small{font-size:12px;color:var(--muted);display:block}
.preview b{font-size:14px;display:block}
.preview span{font-size:12px;color:var(--ink-2);display:block}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{display:flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:1px solid #D5D8DE;border-radius:999px;background:#fff;font-size:13px;font-weight:600;color:var(--ink-2)}
.cat i{width:8px;height:8px;border-radius:4px}
.msg{font-size:13px;font-weight:500;color:#0B6158}
.msg.err{color:var(--sun)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.primary{flex:1 1 160px;min-height:46px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:15px;font-weight:600}
.primary:hover{filter:brightness(.95)}
.ghost{min-height:46px;padding:0 18px;border:1px solid #D5D8DE;border-radius:12px;background:#fff;font-size:15px;font-weight:600}
.listhead{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.listhead .t{flex:1 1 160px;display:flex;align-items:baseline;gap:8px}
.listhead h2{font-size:18px}
.listhead span{font-size:13px;color:var(--muted)}
.item{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-radius:14px;border:1px solid var(--line-2);min-width:0}
.item.editing{border-color:var(--accent)}
.item .grow b{font-size:15px}
.item .grow span+span{color:var(--ink-2)}
.ib{width:40px;height:40px;flex:none;border:0;border-radius:10px;background:transparent;color:var(--ink-2);display:flex;align-items:center;justify-content:center;padding:0}
.ib:hover{background:#F1F2F5;color:var(--ink)}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0;border:0;background:transparent;text-align:left;width:100%}
.set b{font-weight:500;font-size:14px;display:block}
.set small{font-size:12px;color:var(--muted);display:block}
.set .switch{width:40px;height:24px;border-radius:12px;flex:none}
.set .switch i{width:20px;height:20px;border-radius:10px}
.set[aria-checked="true"] .switch i{margin-left:16px}
.tools2{display:flex;gap:8px;flex-wrap:wrap}
.gear[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
/* cài đặt */
.settings{display:flex;flex-direction:column;gap:16px}
.settings-t{font-size:24px;font-weight:700;letter-spacing:-.02em}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:20px;align-items:start}
.set label{display:block;cursor:default}
/* mobile */
@media (max-width:760px){
  .wrap{padding:16px 12px 32px;gap:14px}
  .row{gap:14px}
  .side,.listcol{gap:14px}
  .card{padding:16px 12px;border-radius:18px}
  .top .seg{flex:1 1 100%}
  .seg button{white-space:normal;line-height:1.2;padding:6px 10px}
  .seg.sm{flex-wrap:wrap}
  .seg.sm button{flex:1 1 auto}
  .item{align-items:flex-start}
  .calhead h1{font-size:22px}
  .grid7{gap:4px}
  .cell{min-height:58px;padding:6px 2px;align-items:center;border-radius:10px}
  .cell .hd{flex-direction:column;gap:2px}
  .num{width:28px;height:28px;min-width:28px;padding:0;border-radius:14px}
  .lunar{font-size:10px;line-height:1}
  .chip,.more{display:none}
  .dots{display:flex}
}
/* màn hình hẹp: danh sách chỉ giữ ô ngày + tên, ẩn dòng chi tiết */
@media (max-width:500px){
  .item .grow span{display:none}
  .item{align-items:center}
}
/* modal xác nhận */
.modal{width:min(420px,calc(100% - 32px));padding:0;border:0;border-radius:20px;background:var(--surface);color:var(--ink);box-shadow:0 20px 50px rgba(16,24,40,.25)}
.modal::backdrop{background:rgba(22,24,29,.45)}
.modal form{padding:24px;display:flex;flex-direction:column;gap:10px}
.modal h2{font-size:18px;letter-spacing:-.01em}
.modal p{font-size:14px;line-height:1.5;color:var(--ink-2)}
.modal .actions{margin-top:10px;justify-content:flex-end}
.modal .primary{flex:0 0 auto;padding:0 22px}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="ask" class="modal" aria-labelledby="ask-t" aria-describedby="ask-m">
  <form method="dialog">
    <h2 id="ask-t"></h2>
    <p id="ask-m"></p>
    <div class="actions">
      <button type="submit" class="ghost" value="cancel" id="ask-no" autofocus>Huỷ</button>
      <button type="submit" class="primary" value="ok" id="ask-ok">Đồng ý</button>
    </div>
  </form>
</dialog>
<script>
/* =========================================================
   Lịch Nhớ — quản lý ngày quan trọng (dương lịch + âm lịch)
   Lịch âm: thuật toán Hồ Ngọc Đức, múi giờ +7.
   Dữ liệu lưu trên Google Sheet (qua Apps Script, xem apps-script/Code.gs),
   kèm bản sao trong localStorage để dùng khi mất mạng / chưa kết nối.
   ========================================================= */
const CATS = [
  { id:'tet', label:'Lễ, Tết', color:'#C8372D', tint:'#FDECEA', ink:'#9A2219' },
  { id:'gio', label:'Cúng giỗ', color:'#7A4CC4', tint:'#F1EBFB', ink:'#5A3596' },
  { id:'birthday', label:'Sinh nhật', color:'#2F6BDE', tint:'#E8F0FD', ink:'#1E4EA6' },
  { id:'anniv', label:'Kỷ niệm', color:'#0F8A7E', tint:'#E1F3F0', ink:'#0B6158' },
  { id:'other', label:'Khác', color:'#6B7180', tint:'#EEEFF2', ink:'#3F4552' }
];
const WD_FULL = ['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const WD_SHORT = ['CN','T2','T3','T4','T5','T6','T7'];
const LM = ['Giêng','Hai','Ba','Tư','Năm','Sáu','Bảy','Tám','Chín','Mười','Một','Chạp'];
const CAN = ['Giáp','Ất','Bính','Đinh','Mậu','Kỷ','Canh','Tân','Nhâm','Quý'];
const CHI = ['Tý','Sửu','Dần','Mão','Thìn','Tỵ','Ngọ','Mùi','Thân','Dậu','Tuất','Hợi'];
const TZ = 7;
const STORE_KEY = 'lichnho-v1';
const API_STORE = 'lichnho-api';
const SETTINGS_STORE = 'lichnho-settings';
const UPCOMING_OPTS = [3, 5, 7, 10, 15, 20, 30];
// Kết nối mặc định cho mọi thiết bị. Lưu ý: repo public → ai xem source cũng thấy key này.
const DEFAULT_API = {
  url: 'https://script.google.com/macros/s/AKfycbxD3grye0EPXMYpDc8hL-CBGiX0lzWJG7bYobSEESKNGqw4AX3440IHc0DuSiZJMXwAKw/exec',
  key: 'f0a05fe1-ec7e-48a1-b838-5e1eb0566425'
};

/* ---------- Thuật toán lịch âm ---------- */
const INT = Math.floor, PI = Math.PI;
function jdFromDate(dd, mm, yy) {
  const a = INT((14 - mm) / 12), y = yy + 4800 - a, m = mm + 12 * a - 3;
  let jd = dd + INT((153 * m + 2) / 5) + 365 * y + INT(y / 4) - INT(y / 100) + INT(y / 400) - 32045;
  if (jd < 2299161) jd = dd + INT((153 * m + 2) / 5) + 365 * y + INT(y / 4) - 32083;
  return jd;
}
function jdToDate(jd) {
  let a, b, c;
  if (jd > 2299160) { a = jd + 32044; b = INT((4 * a + 3) / 146097); c = a - INT((b * 146097) / 4); }
  else { b = 0; c = jd + 32082; }
  const d = INT((4 * c + 3) / 1461), e = c - INT((1461 * d) / 4), m = INT((5 * e + 2) / 153);
  return [e - INT((153 * m + 2) / 5) + 1, m + 3 - 12 * INT(m / 10), b * 100 + d - 4800 + INT(m / 10)];
}
function newMoon(k, tz) {
  const T = k / 1236.85, T2 = T * T, T3 = T2 * T, dr = PI / 180;
  let Jd1 = 2415020.75933 + 29.53058868 * k + 0.0001178 * T2 - 0.000000155 * T3;
  Jd1 += 0.00033 * Math.sin((166.56 + 132.87 * T - 0.009173 * T2) * dr);
  const M = 359.2242 + 29.10535608 * k - 0.0000333 * T2 - 0.00000347 * T3;
  const Mpr = 306.0253 + 385.81691806 * k + 0.0107306 * T2 + 0.00001236 * T3;
  const F = 21.2964 + 390.67050646 * k - 0.0016528 * T2 - 0.00000239 * T3;
  let C1 = (0.1734 - 0.000393 * T) * Math.sin(M * dr) + 0.0021 * Math.sin(2 * dr * M);
  C1 = C1 - 0.4068 * Math.sin(Mpr * dr) + 0.0161 * Math.sin(dr * 2 * Mpr);
  C1 = C1 - 0.0004 * Math.sin(dr * 3 * Mpr);
  C1 = C1 + 0.0104 * Math.sin(dr * 2 * F) - 0.0051 * Math.sin(dr * (M + Mpr));
  C1 = C1 - 0.0074 * Math.sin(dr * (M - Mpr)) + 0.0004 * Math.sin(dr * (2 * F + M));
  C1 = C1 - 0.0004 * Math.sin(dr * (2 * F - M)) - 0.0006 * Math.sin(dr * (2 * F + Mpr));
  C1 = C1 + 0.0010 * Math.sin(dr * (2 * F - Mpr)) + 0.0005 * Math.sin(dr * (2 * Mpr + M));
  const deltat = T < -11
    ? 0.001 + 0.000839 * T + 0.0002261 * T2 - 0.00000845 * T3 - 0.000000081 * T * T3
    : -0.000278 + 0.000265 * T + 0.000262 * T2;
  return INT(Jd1 + C1 - deltat + 0.5 + tz / 24);
}
function sunLong(jdn, tz) {
  const T = (jdn - 2451545.5 - tz / 24) / 36525, T2 = T * T, dr = PI / 180;
  const M = 357.52910 + 35999.05030 * T - 0.0001559 * T2 - 0.00000048 * T * T2;
  const L0 = 280.46645 + 36000.76983 * T + 0.0003032 * T2;
  let DL = (1.914600 - 0.004817 * T - 0.000014 * T2) * Math.sin(dr * M);
  DL += (0.019993 - 0.000101 * T) * Math.sin(dr * 2 * M) + 0.000290 * Math.sin(dr * 3 * M);
  let L = (L0 + DL) * dr;
  L = L - PI * 2 * INT(L / (PI * 2));
  return INT(L / PI * 6);
}
function month11(yy, tz) {
  const k = INT((jdFromDate(31, 12, yy) - 2415021) / 29.530588853);
  let nm = newMoon(k, tz);
  if (sunLong(nm, tz) >= 9) nm = newMoon(k - 1, tz);
  return nm;
}
function leapOffset(a11, tz) {
  const k = INT((a11 - 2415021.076998695) / 29.530588853 + 0.5);
  let last = 0, i = 1, arc = sunLong(newMoon(k + i, tz), tz);
  do { last = arc; i++; arc = sunLong(newMoon(k + i, tz), tz); } while (arc !== last && i < 14);
  return i - 1;
}
function solar2lunar(dd, mm, yy, tz) {
  const dayNumber = jdFromDate(dd, mm, yy);
  const k = INT((dayNumber - 2415021.076998695) / 29.530588853);
  let monthStart = newMoon(k + 1, tz);
  if (monthStart > dayNumber) monthStart = newMoon(k, tz);
  let a11 = month11(yy, tz), b11 = a11, lunarYear;
  if (a11 >= monthStart) { lunarYear = yy; a11 = month11(yy - 1, tz); }
  else { lunarYear = yy + 1; b11 = month11(yy + 1, tz); }
  const lunarDay = dayNumber - monthStart + 1;
  const diff = INT((monthStart - a11) / 29);
  let lunarLeap = 0, lunarMonth = diff + 11;
  if (b11 - a11 > 365) {
    const lmd = leapOffset(a11, tz);
    if (diff >= lmd) { lunarMonth = diff + 10; if (diff === lmd) lunarLeap = 1; }
  }
  if (lunarMonth > 12) lunarMonth -= 12;
  if (lunarMonth >= 11 && diff < 4) lunarYear -= 1;
  return [lunarDay, lunarMonth, lunarYear, lunarLeap];
}
function lunar2solar(ld, lm, ly, leap, tz) {
  let a11, b11;
  if (lm < 11) { a11 = month11(ly - 1, tz); b11 = month11(ly, tz); }
  else { a11 = month11(ly, tz); b11 = month11(ly + 1, tz); }
  const k = INT(0.5 + (a11 - 2415021.076998695) / 29.530588853);
  let off = lm - 11;
  if (off < 0) off += 12;
  if (b11 - a11 > 365) {
    const lo = leapOffset(a11, tz);
    let leapMonth = lo - 2;
    if (leapMonth < 0) leapMonth += 12;
    if (leap !== 0 && lm !== leapMonth) return [0, 0, 0];
    else if (leap !== 0 || off >= lo) off += 1;
  }
  return jdToDate(newMoon(k + off, tz) + ld - 1);
}

/* ---------- Tiện ích ngày ---------- */
const cache = {};
function info(jd) {
  if (cache[jd]) return cache[jd];
  const [d, m, y] = jdToDate(jd);
  const [ld, lm, ly, leap] = solar2lunar(d, m, y, TZ);
  return (cache[jd] = { jd, d, m, y, ld, lm, ly, leap, wd: (jd + 1) % 7 });
}
const jdOf = (y, m, d) => jdFromDate(d, m, y);
const canChiYear = y => CAN[(y + 6) % 10] + ' ' + CHI[(y + 8) % 12];
const canChiDay = jd => CAN[(jd + 9) % 10] + ' ' + CHI[(jd + 1) % 12];
const canChiMonth = (lm, ly) => CAN[(ly * 12 + lm + 3) % 10] + ' ' + CHI[(lm + 1) % 12];
const lunarDayName = d => d === 15 ? 'Rằm' : (d <= 10 ? 'Mùng ' + d : 'Ngày ' + d);
const lmName = i => LM[i.lm - 1] + (i.leap ? ' nhuận' : '');
const pad = n => (n < 10 ? '0' : '') + n;
const fmt = i => pad(i.d) + '/' + pad(i.m) + '/' + i.y;
const cat = id => CATS.find(c => c.id === id) || CATS[4];
const countdown = n => n === 0 ? 'Hôm nay' : n === 1 ? 'Ngày mai' : 'Còn ' + n + ' ngày';
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const evDate = e => e.type === 'solar'
  ? 'Ngày ' + e.day + '/' + e.month + ' dương lịch'
  : lunarDayName(e.day) + ' tháng ' + LM[e.month - 1] + ' âm lịch';

function matches(inf, events) {
  return events.filter(e => {
    if (e.type === 'solar') return e.day === inf.d && e.month === inf.m;
    if (inf.leap || e.month !== inf.lm) return false;
    if (e.day === inf.ld) return true;
    // giỗ ngày 30 nhưng tháng thiếu (29 ngày) → tính vào ngày 29
    return e.day === 30 && inf.ld === 29 && info(inf.jd + 1).ld === 1;
  });
}
function lunarToJd(d, m, ly) {
  const r = lunar2solar(d, m, ly, 0, TZ);
  if (!r[0]) return null;
  let jd = jdOf(r[2], r[1], r[0]);
  if (d === 30 && info(jd).ld !== 30) jd -= 1;
  return jd;
}
function nextOcc(e, fromJd) {
  const fi = info(fromJd);
  let best = null;
  if (e.type === 'solar') {
    for (let yy = fi.y; yy <= fi.y + 4; yy++) {
      const dt = new Date(yy, e.month - 1, e.day);
      if (dt.getMonth() !== e.month - 1) continue;
      const jd = jdOf(yy, e.month, e.day);
      if (jd >= fromJd) { best = jd; break; }
    }
  } else {
    for (const ly of [fi.ly - 1, fi.ly, fi.ly + 1]) {
      const jd = lunarToJd(e.day, e.month, ly);
      if (jd && jd >= fromJd) { best = jd; break; }
    }
  }
  return best === null ? null : { jd: best, diff: best - fromJd, inf: info(best) };
}
// Ngày dương mà sự kiện rơi vào trong năm dương lịch y (dùng để sắp xếp theo năm)
function yearJd(e, y) {
  if (e.type === 'solar') {
    const last = new Date(y, e.month, 0).getDate(); // 29/2 năm không nhuận → 28/2
    return jdOf(y, e.month, Math.min(e.day, last));
  }
  const lo = jdOf(y, 1, 1), hi = jdOf(y, 12, 31);
  const hit = [y - 1, y].map(ly => lunarToJd(e.day, e.month, ly)).find(jd => jd && jd >= lo && jd <= hi);
  return hit || lunarToJd(e.day, e.month, y) || lo;
}

// Gửi text/plain để không bị CORS preflight — Apps Script không xử lý OPTIONS.
async function api(action, payload) {
  const res = await fetch(S.api.url, { method:'POST', body: JSON.stringify({ action, key:S.api.key, ...payload }) });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Lỗi không xác định');
  return data;
}
/* ---------- Modal xác nhận (thay cho confirm) ---------- */
// Trả về Promise<boolean>: true khi bấm nút đồng ý; Esc, Huỷ hoặc bấm ra ngoài → false.
function ask({ title, message = '', ok = 'Đồng ý', cancel = 'Huỷ' }) {
  const d = document.getElementById('ask');
  d.querySelector('#ask-t').textContent = title;
  d.querySelector('#ask-m').textContent = message;
  d.querySelector('#ask-ok').textContent = ok;
  d.querySelector('#ask-no').textContent = cancel;
  d.returnValue = '';
  d.showModal();
  return new Promise(res => d.addEventListener('close', () => res(d.returnValue === 'ok'), { once:true }));
}
document.getElementById('ask').addEventListener('click', ev => {
  if (ev.target === ev.currentTarget) ev.currentTarget.close(); // bấm vào nền mờ
});

async function pull(seedIfEmpty) {
  if (!S.api.url) return;
  S.sync = 'loading'; S.syncMsg = ''; render();
  try {
    const d = await api('list');
    if (seedIfEmpty && !d.events.length && S.events.length &&
        await ask({ title:'Google Sheet đang trống',
          message:'Đẩy ' + S.events.length + ' ngày đang có trên máy lên Sheet? Chọn "Không" để dùng Sheet trống.',
          ok:'Đẩy lên Sheet', cancel:'Không' })) {
      await api('replaceAll', { events:S.events });
      S.syncMsg = 'Đã đẩy ' + S.events.length + ' ngày lên Google Sheet.';
    } else {
      S.events = d.events; persist();
      S.syncMsg = 'Đã tải ' + d.events.length + ' ngày từ Google Sheet.';
    }
    S.sync = 'ok';
  } catch (e) {
    S.sync = 'err'; S.syncMsg = 'Không kết nối được Google Sheet (' + e.message + '). Đang dùng dữ liệu lưu trên máy.';
  }
  render();
}
function push(action, payload, okMsg) {
  if (!S.api.url) return;
  S.sync = 'loading';
  api(action, payload)
    .then(() => { S.sync = 'ok'; S.syncMsg = okMsg; })
    .catch(e => { S.sync = 'err'; S.syncMsg = 'Chưa ghi được lên Google Sheet (' + e.message + '). Thay đổi mới chỉ lưu trên máy.'; })
    .then(render);
}

function renderCalendar() {

  let cells = '';
  for (let i = 0; i < rows * 7; i++) {
    const jd = firstJd - offset + i, inf = info(jd);
    const evs = matches(inf, S.events);

    const lunarLabel = inf.ld === 1 ? inf.ld + '/' + inf.lm + (inf.leap ? 'n' : '') : inf.ld;
    const cls = ['cell', inf.m !== S.vm && 'out', jd === todayJd && 'today', jd === selJd && 'sel', inf.wd === 0 && 'sunday'].filter(Boolean).join(' ');

      <div class="grow"><b>${esc(e.name)}</b>
        <span>${c.label} · ${evDate(e)}${e.remind ? ' · nhắc trước ' + e.remind + ' ngày' : ''}</span>
        <span>${n ? 'Lần tới: ' + WD_FULL[n.inf.wd] + ', ' + fmt(n.inf) + ' · ' + countdown(n.diff) : 'Không có ngày này trong vài năm tới'}</span></div>
      <button type="button" class="ib" aria-label="Sửa ${esc(e.name)}" data-act="edit" data-arg="${esc(e.id)}">${ic.edit}</button>
      <button type="button" class="ib" aria-label="Xoá ${esc(e.name)}" data-act="del" data-arg="${esc(e.id)}">${ic.del}</button>
    </div>`; }).join('');
  const nSolar = S.events.filter(e => e.type === 'solar').length;
  const catCount = id => S.events.filter(e => id === 'all' || cat(e.cat).id === id).length;
  const catFilterBtns = [{ id:'all', label:'Tất cả nhóm' }, ...CATS].map(c => { const on = S.catFilter === c.id;
    const style = on ? (c.tint ? `style="background:${c.tint};color:${c.ink};border-color:${c.color}"` : 'style="background:var(--ink);color:#fff;border-color:var(--ink)"') : '';
    return `<button type="button" class="cat" data-act="catFilter" data-arg="${c.id}" aria-pressed="${on}" ${style}>${c.color ? `<i style="background:${c.color}"></i>` : ''}${c.label} <span style="opacity:.7">${catCount(c.id)}</span></button>`; }).join('');

  return `<div class="row">
    <section class="card form" aria-label="Thêm hoặc sửa">
      <h2 style="font-size:18px">${S.editingId ? 'Sửa ngày quan trọng' : 'Thêm ngày quan trọng'}</h2>
      <div class="field"><label for="f-name">Tên</label>
        <input id="f-name" class="inp" type="text" value="${esc(f.name)}" placeholder="Ví dụ: Giỗ ông nội" data-in="name"></div>
      <div class="field"><span class="lbl" id="f-type-l">Loại lịch</span>
        <div class="seg" role="group" aria-labelledby="f-type-l" style="background:#EEF0F3">
          <button type="button" data-act="type" data-arg="solar" aria-pressed="${!isLunar}">Dương lịch</button>
          <button type="button" data-act="type" data-arg="lunar" aria-pressed="${isLunar}">Âm lịch</button>
        </div></div>
      <div class="two">
        <div class="field"><label for="f-day">Ngày</label><select id="f-day" class="inp" data-ch="day">${dayOpts}</select></div>
        <div class="field"><label for="f-month">Tháng</label><select id="f-month" class="inp" data-ch="month">${monthOpts}</select></div>
      </div>
      <div class="preview"><span style="color:var(--muted);flex:none">${ic.cal}</span><div><small>Lần tới rơi vào</small>${preview}</div></div>
      <div class="field"><span class="lbl" id="f-cat-l">Nhóm</span><div class="cats" role="group" aria-labelledby="f-cat-l">${catBtns}</div></div>
      <div class="field"><label for="f-remind">Nhắc trước</label><select id="f-remind" class="inp" data-ch="remind">${remindOpts}</select></div>
      <div class="field"><label for="f-note">Ghi chú</label>
        <textarea id="f-note" class="inp" rows="3" placeholder="Mâm cỗ, người cần báo, việc cần chuẩn bị…" data-in="note">${esc(f.note)}</textarea></div>
      ${S.msg ? `<p class="msg${S.msgErr ? ' err' : ''}" role="status">${esc(S.msg)}</p>` : ''}
      <div class="actions">
        <button type="button" class="primary" data-act="save">${S.editingId ? 'Lưu thay đổi' : 'Lưu'}</button>
        <button type="button" class="ghost" data-act="reset">${S.editingId ? 'Huỷ' : 'Làm mới'}</button>
      </div>
    </section>
    <div class="listcol">
      <section class="card" aria-label="Danh sách ngày quan trọng">
        <div class="listhead">
          <div class="t"><h2>Danh sách</h2><span>${S.events.length} ngày · ${nSolar} dương, ${S.events.length - nSolar} âm</span></div>
          <div class="seg sm" role="group" aria-label="Lọc theo loại lịch">
            ${[['all','Tất cả'],['solar','Dương lịch'],['lunar','Âm lịch']].map(([id, l]) => `<button type="button" data-act="filter" data-arg="${id}" aria-pressed="${S.filter === id}">${l}</button>`).join('')}
          </div>
        </div>
        <div class="cats" role="group" aria-label="Lọc theo nhóm">${catFilterBtns}</div>
        <div style="display:flex;flex-direction:column;gap:8px">${items || '<p class="empty" style="text-align:center;padding:24px 0">Chưa có ngày nào trong mục này.</p>'}</div>
      </section>
    </div>
  </div>`;
}

function renderSettings() {
  const setBtn = (key, label, hint) => `<button type="button" class="set" role="switch" aria-checked="${S[key]}" data-act="toggle" data-arg="${key}"><span><b>${label}</b><small>${hint}</small></span><span class="switch"><i></i></span></button>`;
  const upOpts = UPCOMING_OPTS.map(n => `<option value="${n}"${n === S.upcomingLimit ? ' selected' : ''}>${n} ngày</option>`).join('');
  return `<div class="settings">
    <h1 class="settings-t">Cài đặt</h1>
    <div class="settings-grid">
      <section class="card" aria-label="Tuỳ chọn hiển thị" style="gap:4px">
        <h2 style="font-size:16px;margin-bottom:8px">Hiển thị</h2>
        ${setBtn('showLunar', 'Hiện ngày âm trên lịch', 'Số nhỏ ở góc mỗi ô ngày')}
        ${setBtn('markRam', 'Đánh dấu mùng 1 và ngày rằm', 'Tô màu ngày 1 và 15 âm lịch để nhớ cúng')}
        ${setBtn('weekMon', 'Tuần bắt đầu từ Thứ Hai', 'Tắt để bắt đầu từ Chủ nhật')}
        <div class="set"><label for="f-upcoming"><b>Số ngày trong mục “Sắp tới”</b><small>Không giới hạn khoảng thời gian</small></label>
          <select id="f-upcoming" class="inp" style="width:auto;flex:none" data-set="upcomingLimit">${upOpts}</select></div>
      </section>
      <section class="card" aria-label="Kết nối Google Sheet" style="gap:12px">
        <h2 style="font-size:16px">Kết nối Google Sheet</h2>
        <p class="empty" style="font-size:13px">App đã có sẵn kết nối mặc định cho mọi thiết bị. Chỉ cần nhập ở đây nếu muốn dùng Sheet khác trên trình duyệt này.</p>
        <div class="field"><label for="f-url">URL Web App</label>
          <input id="f-url" class="inp" type="url" value="${esc(S.apiForm.url)}" placeholder="https://script.google.com/macros/s/…/exec" data-api="url"></div>
        <div class="field"><label for="f-key">API key</label>
          <input id="f-key" class="inp" type="password" value="${esc(S.apiForm.key)}" autocomplete="off" data-api="key"></div>
        ${S.apiErr || S.syncMsg ? `<p class="msg${S.apiErr || S.sync === 'err' ? ' err' : ''}" role="status">${esc(S.apiErr || S.syncMsg)}</p>` : ''}
        <div class="tools2">
          <button type="button" class="btn" data-act="connect">${S.api.url ? 'Lưu & tải lại' : 'Kết nối'}</button>
          ${S.api.url !== DEFAULT_API.url || S.api.key !== DEFAULT_API.key ? '<button type="button" class="btn" data-act="resetApi">Về kết nối mặc định</button>' : ''}
        </div>
      </section>
      <section class="card" aria-label="Sao lưu" style="gap:12px">
        <h2 style="font-size:16px">Sao lưu dữ liệu</h2>
        <p class="empty" style="font-size:13px">${S.api.url
          ? 'Dữ liệu chính nằm trên Google Sheet. Nhập JSON sẽ thêm các ngày trong file vào Sheet, không xoá ngày đang có.'
          : 'Dữ liệu lưu trong trình duyệt này. Nhập JSON sẽ thêm các ngày trong file, không xoá ngày đang có.'}</p>
        ${S.bkMsg ? `<p class="msg${S.bkErr ? ' err' : ''}" role="status">${esc(S.bkMsg)}</p>` : ''}
        <div class="tools2">
          <button type="button" class="btn" data-act="export">${ic.down}Xuất JSON</button>
          <button type="button" class="btn" data-act="import">${ic.up}Nhập JSON</button>
          <input type="file" id="f-import" accept="application/json,.json" hidden>
        </div>
      </section>
    </div>
  </div>`;
}

function render() {
  document.documentElement.style.setProperty('--accent', '#C8372D');
  document.getElementById('app').innerHTML =
    `<div class="wrap">${renderHeader()}${S.view === 'calendar' ? renderCalendar() : S.view === 'settings' ? renderSettings() : renderConfig()}</div>`;
}

/* ---------- Hành động ---------- */
function setForm(p) { S.form = { ...S.form, ...p }; S.msg = ''; }

// Gộp danh sách nhập vào danh sách hiện có:
// trùng id → cập nhật (nếu khác); trùng tên + loại lịch + ngày/tháng → bỏ qua; còn lại → thêm mới.
const EV_FIELDS = ['name','type','day','month','cat','remind','note'];
function mergeEvents(base, incoming) {
  const out = base.slice();
  const key = e => [String(e.name).trim().toLowerCase(), e.type, e.day, e.month].join('|');
  const keys = new Set(out.map(key));
  let added = 0, updated = 0, skipped = 0;
  incoming.forEach((raw, i) => {
    if (!raw || !String(raw.name || '').trim()) { skipped++; return; }
    const e = { ...raw, name: String(raw.name).trim(), type: raw.type === 'solar' ? 'solar' : 'lunar',
      day: +raw.day || 1, month: +raw.month || 1, cat: raw.cat || 'other', remind: +raw.remind || 0, note: raw.note || '' };
    const at = e.id ? out.findIndex(x => x.id === e.id) : -1;
    if (at >= 0) {
      if (EV_FIELDS.every(f => out[at][f] === e[f])) skipped++;
      else { out[at] = { ...out[at], ...e }; updated++; }
    } else if (keys.has(key(e))) skipped++;
    else { out.push({ ...e, id: e.id || 'e' + Date.now() + '-' + i }); keys.add(key(e)); added++; }
  });
  return { events: out, added, updated, skipped };
}

const actions = {
  view: v => { S.view = v; },
  pick: jd => { const i = info(+jd); S.sel = { y:i.y, m:i.m, d:i.d }; S.vy = i.y; S.vm = i.m; S.view = 'calendar'; },
  month: d => { let m = S.vm + (+d), y = S.vy; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } S.vm = m; S.vy = y; },
  today: () => { S.vy = today.y; S.vm = today.m; S.sel = { ...today }; },
  toggle: k => { S[k] = !S[k]; saveSettings(); },
  addForDay: () => {
    const jd = jdOf(S.sel.y, S.sel.m, S.sel.d), i = info(jd), t = S.form.type || 'lunar';
    S.form = { ...blankForm(), type:t, day: t === 'solar' ? i.d : i.ld, month: t === 'solar' ? i.m : i.lm, srcJd: jd };
    S.editingId = null; S.msg = ''; S.view = 'config';
  },
  type: t => {
    const f = S.form; let day = f.day, month = f.month;
    if (f.srcJd) { const i = info(f.srcJd); day = t === 'solar' ? i.d : i.ld; month = t === 'solar' ? i.m : i.lm; }
    else if (t === 'lunar' && day > 30) day = 30;
    setForm({ type:t, day, month });
  },
  cat: id => setForm({ cat:id }),
  filter: id => { S.filter = id; },
  catFilter: id => { S.catFilter = id; },
  save: () => {
    const f = S.form, name = (f.name || '').trim();
    if (!name) { S.msg = 'Vui lòng nhập tên ngày quan trọng.'; S.msgErr = true; return; }
    const rec = { id: S.editingId || 'e' + Date.now(), name, type:f.type, day:f.day, month:f.month, cat:f.cat, remind:f.remind, note:f.note };
    if (S.editingId) S.events = S.events.map(e => e.id === S.editingId ? rec : e);
    else S.events = S.events.concat([rec]);
    S.form = blankForm(); S.editingId = null; S.msg = 'Đã lưu “' + name + '”.'; S.msgErr = false;
    persist();
    push('upsert', { event:rec }, 'Đã lưu “' + name + '” lên Google Sheet.');
  },
  reset: () => { S.form = blankForm(); S.editingId = null; S.msg = ''; },
  edit: id => {
    const e = S.events.find(x => x.id === id); if (!e) return;
    S.view = 'config'; S.editingId = id; S.msg = '';
    S.form = { name:e.name, type:e.type, day:e.day, month:e.month, cat:e.cat, remind:e.remind || 0, note:e.note || '', srcJd:null };
    window.scrollTo({ top:0, behavior:'smooth' });
  },
  del: id => {
    const e = S.events.find(x => x.id === id); if (!e) return;
    ask({ title:'Xoá “' + e.name + '”?',
      message: cat(e.cat).label + ' · ' + evDate(e) + '. ' +
        (S.api.url ? 'Ngày này cũng sẽ bị xoá trên Google Sheet.' : 'Thao tác này không thể hoàn tác.'),
      ok:'Xoá' }).then(yes => {
      if (!yes) return;
      S.events = S.events.filter(x => x.id !== id);
      if (S.editingId === id) { S.editingId = null; S.form = blankForm(); }
      S.msg = 'Đã xoá “' + e.name + '”.'; S.msgErr = false;
      persist();
      push('delete', { id }, 'Đã xoá “' + e.name + '” trên Google Sheet.');
      render();
    });
    return false;
  },
  connect: () => {
    const url = (S.apiForm.url || '').trim(), key = (S.apiForm.key || '').trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) { S.apiErr = 'URL phải có dạng https://script.google.com/macros/s/…/exec'; return; }
    if (!key) { S.apiErr = 'Vui lòng nhập API key.'; return; }
    S.apiErr = ''; S.api = { url, key };
    try { localStorage.setItem(API_STORE, JSON.stringify(S.api)); } catch (e) {}
    pull(true);
    return false;
  },
  resetApi: () => {
    S.api = { ...DEFAULT_API }; S.apiForm = { ...DEFAULT_API }; S.apiErr = '';
    try { localStorage.removeItem(API_STORE); } catch (e) {}
    pull();
    return false;
  },
  export: () => {
    const blob = new Blob([JSON.stringify({ events:S.events }, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'lich-nho-backup.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    return false;
  },
  import: () => { document.getElementById('f-import').click(); return false; }
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const res = actions[el.dataset.act](el.dataset.arg);
  if (res !== false) render();
});
document.addEventListener('input', ev => {
  const k = ev.target.dataset.in;
  if (k) { S.form[k] = ev.target.value; } // không render lại để giữ con trỏ khi gõ
  const a = ev.target.dataset.api;
  if (a) S.apiForm[a] = ev.target.value;
});
document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.dataset.ch) { setForm({ [t.dataset.ch]: parseInt(t.value, 10), ...(t.dataset.ch !== 'remind' ? { srcJd:null } : {}) }); render(); }
  if (t.dataset.set) { S[t.dataset.set] = parseInt(t.value, 10); saveSettings(); render(); }
  if (t.id === 'f-import' && t.files[0]) {
    const file = t.files[0];
    t.value = ''; // cho phép chọn lại cùng file
    const done = (msg, err) => { S.bkMsg = msg; S.bkErr = !!err; render(); };
    let incoming;
    try {
      const data = JSON.parse(await file.text());
      incoming = Array.isArray(data) ? data : data.events;
      if (!Array.isArray(incoming)) throw 0;
    } catch (e) { return done('File không hợp lệ.', true); }
    // Đang kết nối Sheet: lấy bản mới nhất trước khi gộp để không mất thay đổi từ thiết bị khác
    if (S.api.url) {
      done('Đang tải dữ liệu mới nhất từ Google Sheet…');
      try { S.events = (await api('list')).events; persist(); }
      catch (e) { return done('Không tải được Google Sheet (' + e.message + '), chưa nhập gì.', true); }
    }
    const m = mergeEvents(S.events, incoming);
    if (!m.added && !m.updated) return done('Không có gì mới: ' + m.skipped + ' ngày trong file đã có sẵn.');
    const yes = await ask({ title:'Nhập từ “' + file.name + '”?',
      message:'Thêm ' + m.added + ' ngày mới, cập nhật ' + m.updated + ' ngày, bỏ qua ' + m.skipped + ' ngày đã có. Dữ liệu hiện tại được giữ nguyên.',
      ok:'Nhập' });
    if (!yes) return done('');
    S.events = m.events; persist();
    // danh sách đã gộp trên nền bản mới nhất từ Sheet → ghi lại toàn bộ là an toàn
    push('replaceAll', { events:S.events }, 'Đã ghi ' + S.events.length + ' ngày lên Google Sheet.');
    done('Đã thêm ' + m.added + ', cập nhật ' + m.updated + ' ngày.');
  }
});

render();
pull();
</script>
</body>
</html>
